# ==============================================================================
# Global Automation Framework Configuration
# ==============================================================================

# Target Application URL (Environment under test)
app.url=https://lakshya.zfourhr.in

# Default Browser (Options: chrome, edge, firefox)
# Can be overridden via Maven CLI: -Dbrowser=edge
browser=chrome

# Headless Mode (true: runs in background without GUI; false: opens physical browser)
# Can be overridden via Maven CLI: -Dheadless=true
headless=false

# Explicit Wait Timeout in Seconds for dynamic UI elements
explicit.wait.seconds=15

# Page Load Timeout in Seconds
page.load.timeout.seconds=30
